services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "8888:8000"
    volumes:
      - dynamo-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - creditprofile-net

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - creditprofile-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - creditprofile-net

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - creditprofile-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - creditprofile-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - creditprofile-net

  loki:
    image: grafana/loki
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped
    networks:
      - creditprofile-net

  promtail:
    image: grafana/promtail
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    restart: unless-stopped
    networks:
      - creditprofile-net

  jaeger:
    image: jaegertracing/all-in-one
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped
    networks:
      - creditprofile-net

  # Servicios de inicialización (ejecutar una vez)
  dynamo-init:
    build:
      context: ./scripts/init-dynamo
      dockerfile: Dockerfile
    container_name: dynamo-init
    env_file: .env
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - creditprofile-net
    restart: "no"

  minio-init:
    build:
      context: ./scripts/init-minio
      dockerfile: Dockerfile
    container_name: minio-init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - creditprofile-net
    restart: "no"

  dynamo-seed:
    build:
      context: ./scripts/seed-dynamo
      dockerfile: Dockerfile
    container_name: dynamo-seed
    env_file: .env
    depends_on:
      - dynamo-init
    networks:
      - creditprofile-net
    restart: "no"

  ollama-pull:
    image: ollama/ollama
    container_name: ollama-pull
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    command: >
      sh -c "ollama pull ${OLLAMA_MODEL:-llama3.2}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - creditprofile-net
    restart: "no"

networks:
  creditprofile-net:
    driver: bridge

volumes:
  dynamo-data:
  minio-data:
  ollama-models:
